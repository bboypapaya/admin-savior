        }

        async function encodeCanvasWithFormat(srcCanvas, formatMode) {
            if (formatMode === 'png') {
                const blob = await canvasToBlobAsync(srcCanvas, 'image/png');
                return { blob: blob, ext: 'png', mime: 'image/png' };
            }
            const workCanvas = document.createElement('canvas');
            workCanvas.width = srcCanvas.width;
            workCanvas.height = srcCanvas.height;
            const wctx = workCanvas.getContext('2d');
            wctx.fillStyle = '#ffffff';
            wctx.fillRect(0, 0, workCanvas.width, workCanvas.height);
            wctx.drawImage(srcCanvas, 0, 0);

            if (formatMode === 'jpg_hq') {
                const blob = await canvasToBlobAsync(workCanvas, 'image/jpeg', 0.92);
                workCanvas.width = workCanvas.height = 0;
                return { blob: blob, ext: 'jpg', mime: 'image/jpeg' };
            }

            let maxBytes = 1024 * 1024;
            if (formatMode === 'jpg_2m') maxBytes = 2 * 1024 * 1024;
            else if (formatMode === 'jpg_500k') maxBytes = 500 * 1024;

            let highBlob = await canvasToBlobAsync(workCanvas, 'image/jpeg', 0.92);
            if (highBlob && highBlob.size <= maxBytes) {
                workCanvas.width = workCanvas.height = 0;
                return { blob: highBlob, ext: 'jpg', mime: 'image/jpeg' };
            }

            let lo = 0.15, hi = 0.90, bestBlob = null;
            for (let iter = 0; iter < 6; iter++) {
                const mid = (lo + hi) * 0.5;
                const cand = await canvasToBlobAsync(workCanvas, 'image/jpeg', mid);
                if (cand && cand.size <= maxBytes) {
                    bestBlob = cand;
                    lo = mid;
                } else {
                    hi = mid;
                }
            }
            if (bestBlob) {
                workCanvas.width = workCanvas.height = 0;
                return { blob: bestBlob, ext: 'jpg', mime: 'image/jpeg' };
            }

            let curW = workCanvas.width, curH = workCanvas.height;
            let fallbackBlob = await canvasToBlobAsync(workCanvas, 'image/jpeg', 0.55);
            for (let step = 0; step < 4 && fallbackBlob && fallbackBlob.size > maxBytes; step++) {
                const ratio = Math.min(0.85, Math.sqrt(maxBytes / fallbackBlob.size) * 0.92);
                curW = Math.max(320, Math.round(curW * ratio));
                curH = Math.max(240, Math.round(curH * ratio));
                workCanvas.width = curW;
                workCanvas.height = curH;
                wctx.fillStyle = '#ffffff';
                wctx.fillRect(0, 0, curW, curH);
                wctx.imageSmoothingEnabled = true;
                wctx.imageSmoothingQuality = 'high';
                wctx.drawImage(srcCanvas, 0, 0, curW, curH);
                fallbackBlob = await canvasToBlobAsync(workCanvas, 'image/jpeg', 0.72);
            }
            workCanvas.width = workCanvas.height = 0;
            return { blob: fallbackBlob, ext: 'jpg', mime: 'image/jpeg' };
        }

        btnCopy.addEventListener('click', () => {
            if (busy) return;
            if (!currentImageData) { setStatus('st_copy_no_img', 'red'); return; }
            commitPendingEdits();
            ctx.drawImage(backupCanvas, 0, 0);
            mainCanvas.toBlob(async (blob) => {
                try {
                    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                    if (toolMode === 'KEYSTONE') redraw();
                    setStatus('st_copy_done', 'green');
                } catch (e) {
                    if (toolMode === 'KEYSTONE') redraw();
                    setStatus('st_copy_err', 'red');
                }
            }, 'image/png');
        });

        btnDownload.addEventListener('click', async () => {
            if (busy) return;
            if (!currentImageData) { setStatus('st_dl_no_img', 'red'); return; }
            commitPendingEdits();
            setBusyState(true);
            try {
                const fmtMode = downloadFormatSelect ? downloadFormatSelect.value : 'png';
                const { blob, ext, mime } = await encodeCanvasWithFormat(backupCanvas, fmtMode);
                if (toolMode === 'KEYSTONE') redraw();
                if (!blob) return;
                hasUnsavedChanges = false;
                const fn = `edited_image_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.${ext}`;
                if (isCoarsePointer()) {
                    openMobileSaveModal(blob);
                    setStatus('st_dl_done', 'green');
                    try {
                        const file = new File([blob], fn, { type: mime });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({ files: [file] });
                        }
                    } catch (err) {}
                    return;
                }
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url; link.download = fn;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 60000);
                setStatus('st_dl_done', 'green');
            } finally {
                setBusyState(false);
            }
        });

        btnExportPdf.addEventListener('click', async () => {
            if (busy) return;
            if (!currentImageData) { setStatus('st_pdf_no_img', 'red'); return; }
            commitPendingEdits();
            setBusyState(true);
            try {
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = currentImageData.width;
                exportCanvas.height = currentImageData.height;
                const ectx = exportCanvas.getContext('2d');
                ectx.fillStyle = '#ffffff';
                ectx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
                ectx.drawImage(backupCanvas, 0, 0);

                const jpegBlob = await new Promise(resolve => exportCanvas.toBlob(resolve, 'image/jpeg', 0.95));
                const jpegBytes = new Uint8Array(await jpegBlob.arrayBuffer());
                const iw = exportCanvas.width, ih = exportCanvas.height;
                exportCanvas.width = exportCanvas.height = 0;

                const mm2pt = (mm) => (mm * 72) / 25.4;
                const isLetter = (currentPaper === 'letter');
                const baseW = isLetter ? 215.9 : 210.0, baseH = isLetter ? 279.4 : 297.0;
                let pw = mm2pt(baseW), ph = mm2pt(baseH), dw, dh, px, py;
                let scaledOrNonId = false;

                if (pdfModeSelect.value === 'a4_fit') {
                    if (iw > ih) { pw = mm2pt(baseH); ph = mm2pt(baseW); }
                    const margin = mm2pt(10);
                    const availW = pw - margin * 2, availH = ph - margin * 2;
                    const sc = Math.min(availW / iw, availH / ih);
                    dw = iw * sc; dh = ih * sc;
                    px = (pw - dw) / 2; py = (ph - dh) / 2;
                } else {
                    const idLongPt = mm2pt(85.6);
                    const ar = iw / ih;
                    if (mergeMeta && mergeMeta.totalW === iw && mergeMeta.totalH === ih) {
                        const ratioToSingle = iw / mergeMeta.singleCardW;
                        dw = idLongPt * ratioToSingle;
                        dh = dw / ar;
                    } else {
                        const singleAspect = Math.max(iw, ih) / Math.max(1, Math.min(iw, ih));
                        if (singleAspect < 1.3 || singleAspect > 1.9) scaledOrNonId = true;
                        if (ar >= 1) { dw = idLongPt; dh = dw / ar; }
                        else { dh = idLongPt; dw = dh * ar; }
                    }
                    const margin = mm2pt(10);
                    if (dw > pw - margin * 2 || dh > ph - margin * 2) {
                        const fitSc = Math.min((pw - margin * 2) / dw, (ph - margin * 2) / dh);
                        dw *= fitSc; dh *= fitSc;
                        scaledOrNonId = true;
                    }
                    px = (pw - dw) / 2;
                    py = ph - dh - mm2pt(35);
                    if (py < mm2pt(15)) py = (ph - dh) / 2;
                }

                const pdfBlob = buildPdf(jpegBytes, iw, ih, pw, ph, dw, dh, px, py);
                hasUnsavedChanges = false;
                const finalStatusKey = scaledOrNonId ? 'st_pdf_scaled_note' : 'st_pdf_done';
                const finalStatusColor = scaledOrNonId ? '#e65100' : 'green';
                const fn = `document_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.pdf`;
                if (isCoarsePointer()) {
                    try {
                        const file = new File([pdfBlob], fn, { type: 'application/pdf' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({ files: [file] });
                            setStatus(finalStatusKey, finalStatusColor);
                            return;
                        }
                    } catch (err) {
                        if (err && err.name === 'AbortError') return;
                    }
                }
                const url = URL.createObjectURL(pdfBlob);
                const link = document.createElement('a');
                link.href = url; link.download = fn;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 60000);
                setStatus(finalStatusKey, finalStatusColor);
            } finally {
                setBusyState(false);
            }
        });

        function buildPdf(jpegBytes, iw, ih, pw, ph, dw, dh, px, py) {
            const encoder = new TextEncoder();
            const chunks = [];
            let offset = 0;
            const offsets = [];
            function pushStr(str) {
                const bytes = encoder.encode(str);
                chunks.push(bytes);
                offset += bytes.length;
            }
            function pushBytes(bytes) {
                chunks.push(bytes);
                offset += bytes.length;
            }
            pushStr('%PDF-1.4\n');
            pushBytes(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
            offsets[1] = offset;
            pushStr('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
            offsets[2] = offset;
            pushStr('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
            offsets[3] = offset;
            pushStr(`3 0 obj\n<< /Type /Page /Parent 2 0 R /Resources << /XObject << /Im0 4 0 R >> >> /MediaBox [0 0 ${pw.toFixed(2)} ${ph.toFixed(2)}] /Contents 5 0 R >>\nendobj\n`);
            offsets[4] = offset;
            pushStr(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpegBytes.length} >>\nstream\n`);
            pushBytes(jpegBytes);
            pushStr('\nendstream\nendobj\n');
            const contentStream = `q\n${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${px.toFixed(2)} ${py.toFixed(2)} cm\n/Im0 Do\nQ\n`;
            const contentBytes = encoder.encode(contentStream);
            offsets[5] = offset;
            pushStr(`5 0 obj\n<< /Length ${contentBytes.length} >>\nstream\n`);
            pushBytes(contentBytes);
            pushStr('endstream\nendobj\n');
            const xrefOffset = offset;
            pushStr('xref\n0 6\n0000000000 65535 f \n');
            for (let i = 1; i <= 5; i++) {
                pushStr(`${String(offsets[i]).padStart(10, '0')} 00000 n \n`);
            }
            pushStr(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`);
            return new Blob(chunks, { type: 'application/pdf' });
        }
    })();
    </script>
</body>
