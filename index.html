<body>

    <div class="toolbar-sticky">
        <div class="top-bar">
            <div class="top-group">
                <input type="file" id="uploadInput" accept="image/*" style="display: none;">
                <button id="btnSelectFile" class="btn-primary-soft">📁 選擇檔案</button>
                <button id="btnUndo" disabled>↩ 上一步</button>
                <button id="btnReset">🔄 重置</button>
            </div>
            <div class="top-group">
                <button id="btnCopy">📋 複製</button>
                <button id="btnDownload" class="btn-success-soft">💾 下載圖片</button>
                <select id="pdfMode">
                    <option value="a4_fit" id="optPdfFit">PDF：A4 滿版適應</option>
                    <option value="id_1to1" id="optPdfId">PDF：證件 1:1 實際尺寸</option>
                </select>
                <button id="btnExportPdf" class="btn-primary-soft">📄 匯出 PDF</button>
                <select id="langSelect" aria-label="Language">
                    <option value="zh-TW">🌐 繁體中文</option>
                    <option value="en-US">🌐 English (US)</option>
                    <option value="ja">🌐 日本語</option>
                    <option value="de">🌐 Deutsch</option>
                    <option value="ko">🌐 한국어</option>
                    <option value="fr">🌐 Français</option>
                    <option value="nl">🌐 Nederlands</option>
                    <option value="es">🌐 Español</option>
                    <option value="sv">🌐 Svenska</option>
                </select>
            </div>
        </div>

        <div class="status-strip">
            <span id="status">等待載入圖片...</span>
            <span id="pasteHint">💡 電腦可直接按 <b>Ctrl+V</b> 貼上或<b>拖曳圖片至此</b></span>
        </div>

        <div class="tab-bar">
            <button type="button" class="tab-btn active" id="tabBtn1" data-tab="1">📐 1. 校正・裁切・合併</button>
            <button type="button" class="tab-btn" id="tabBtn2" data-tab="2">✨ 2. 畫質・去霧・去陰影</button>
            <button type="button" class="tab-btn" id="tabBtn3" data-tab="3">🔏 3. 浮水印・遮蔽・標註</button>
        </div>

        <div class="tab-panel active" id="tabPanel1">
            <div class="panel-row">
                <button id="btnRotateCCW">↺ 左轉 90°</button>
                <button id="btnRotateCW">↻ 右轉 90°</button>
                <button id="btnFlipH">↔ 水平翻轉</button>
                <button id="btnFlipV">↕ 上下翻轉</button>
                <span class="divider">|</span>
                <button id="btnCropMode">✂️ 矩形裁切</button>
                <button id="btnKeystoneMode" class="btn-primary-soft">📐 梯形校正 (點4角拉直)</button>
            </div>

            <div class="sub-box" id="keystoneSubBar" style="display: none;">
                <select id="keystoneRatio">
                    <option value="id_auto" id="optRatioIdAuto">比例：依語系自動標準證件 (85.6×54mm)</option>
                    <option value="id_h" id="optRatioIdH">比例：橫式身分證/健保卡 (85.6×54mm)</option>
                    <option value="id_v" id="optRatioIdV">比例：直式證件 (54×85.6mm)</option>
                    <option value="a4_v" id="optRatioA4V">比例：直式公文 (A4 210×297mm)</option>
                    <option value="a4_h" id="optRatioA4H">比例：橫式公文 (A4 297×210mm)</option>
                    <option value="auto" id="optRatioAuto">比例：自由原始推算 (不鎖定)</option>
                </select>
                <button id="btnApplyKeystone" style="display: none; background: #28a745; color: white; border-color: #1e7e34; font-weight: bold;">✔ 確認校正</button>
                <span id="keystoneScaleWrap" style="display: none; align-items: center; gap: 4px; font-size: 0.88em; color: #0d47a1; font-weight: bold;">
                    <span id="lblAspectTune">↔ 寬高自由微調:</span>
                    <input type="range" id="keystoneAspectSlider" min="-45" max="45" value="0" style="width: 95px; vertical-align: middle;">
                    <button type="button" id="btnResetAspect" style="padding: 3px 7px; font-size: 0.85em;">標準比例</button>
                </span>
                <div class="demo-tooltip">
                    <span id="tooltipTrigger">ⓘ 點擊順序示範</span>
                    <div class="tooltip-content">
                        <svg viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg">
                            <polygon points="25,20 105,10 95,90 15,95" fill="#e0e0e0" stroke="#aaa" stroke-width="2"/>
                            <path d="M 25 20 L 105 10 L 95 90 L 15 95 Z" stroke="#ffcc00" stroke-width="2.5" stroke-dasharray="4" fill="none"/>
                            <path d="M 19 20 L 31 20 M 25 14 L 25 26" stroke="#ff0000" stroke-width="3" stroke-linecap="round"/>
                            <text x="36" y="24" fill="white" font-size="12" font-family="Arial" font-weight="bold">1</text>
                            <path d="M 99 10 L 111 10 M 105 4 L 105 16" stroke="#ff0000" stroke-width="3" stroke-linecap="round"/>
                            <text x="90" y="14" fill="white" font-size="12" font-family="Arial" font-weight="bold">2</text>
                            <path d="M 89 90 L 101 90 M 95 84 L 95 96" stroke="#ff0000" stroke-width="3" stroke-linecap="round"/>
                            <text x="80" y="94" fill="white" font-size="12" font-family="Arial" font-weight="bold">3</text>
                            <path d="M 9 95 L 21 95 M 15 89 L 15 101" stroke="#ff0000" stroke-width="3" stroke-linecap="round"/>
                            <text x="26" y="99" fill="white" font-size="12" font-family="Arial" font-weight="bold">4</text>
                        </svg>
                        <div id="tooltipDesc" style="font-size: 12px; line-height: 1.45; text-align: left;">順序必須為：<br><b>1.左上 ➔ 2.右上 ➔ 3.右下 ➔ 4.左下</b></div>
                    </div>
                </div>
            </div>

            <div class="panel-row">
                <span id="lblMerge" style="font-size: 0.9em; font-weight: bold; color: #444;">🪪 證件正反面合併:</span>
                <button id="btnSaveFront">1️⃣ 暫存目前為「正面」</button>
                <button id="btnMergeV" disabled>2️⃣ ↕ 上下合併</button>
                <button id="btnMergeH" disabled>2️⃣ ↔ 左右合併</button>
                <button id="btnClearFront" style="display: none;">✖ 清除暫存</button>
                <span id="frontSlotStatus" style="font-size: 0.84em; color: #666;">（尚未暫存正面圖片）</span>
            </div>
        </div>

        <div class="tab-panel" id="tabPanel2">
            <div class="panel-row">
                <button id="btnColorEnhance" class="btn-primary-soft">✨ 智慧去霧清晰化 (保留全彩)</button>
                <button id="btnDocEnhance">📄 公文/證件黑白強化</button>
                <label style="font-size: 0.88em; cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 3px; margin-right: 4px;">
                    <input type="checkbox" id="chkKeepStamp" checked> <span id="lblKeepStamp">保留彩色印章</span>
                </label>
                <span class="divider">|</span>
                <label style="display: inline-flex; align-items: center; gap: 4px; font-size: 0.88em;">
                    <span id="lblBrightness">☀️ 亮度:</span>
                    <input type="range" id="brightnessSlider" min="-100" max="100" value="0" style="width: 95px;">
                </label>
                <button id="btnApplyBrightness">✔ 確定</button>
                <button id="btnCancelBrightness">✖ 取消</button>
            </div>
        </div>

        <div class="tab-panel" id="tabPanel3">
            <div class="panel-row">
                <label style="font-size: 0.88em; font-weight: bold; color: #444;" for="watermarkText" id="lblWatermark">🔏 防盜用浮水印:</label>
                <input type="text" id="watermarkText" value="僅供業務申辦使用 他用無效" placeholder="請輸入浮水印文字..." style="width: 205px;">
                <select id="watermarkColor">
                    <option value="rgba(80, 80, 80, 0.28)" id="optWmGray">半透明深灰</option>
                    <option value="rgba(200, 30, 30, 0.25)" id="optWmRed">半透明印泥紅</option>
                    <option value="rgba(0, 80, 180, 0.25)" id="optWmBlue">半透明公文藍</option>
                </select>
                <button id="btnApplyWatermark" class="btn-primary-soft">🔏 壓印滿版浮水印</button>
            </div>
            <div class="panel-row">
                <button id="btnMosaicMode">局部馬賽克 (拖曳框選)</button>
                <button id="btnBlackBoxMode">⬛ 個資黑塊</button>
                <span class="divider">|</span>
                <button id="btnRedBoxMode">🟥 紅框標註</button>
                <button id="btnRedLineMode">🖍️ 紅底線標註</button>
            </div>
        </div>
    </div>

    <canvas id="mainCanvas" width="800" height="600"></canvas>
    <canvas id="magnifierCanvas" width="140" height="140"></canvas>

    <div class="footer-bar">
        <span id="footerPrivacy">🛡️ 本工具純本機離線運作，無任何個資上傳風險</span>
        <div class="footer-right-col">
            <div class="footer-row">

                <button type="button" id="btnAddBookmark" class="action-pill-btn" style="background: #007bff;">⭐ 加入瀏覽器書籤</button>
                <button type="button" id="btnAddShortcut" class="action-pill-btn" style="background: #6f42c1;">📲 在手機桌面建立捷徑</button>
            </div>
